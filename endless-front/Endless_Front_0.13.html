const c=document.querySelector('#c'),g=c.getContext('2d'),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),msg=document.querySelector('#msg');let nextBoss=30;let W=360,H=640,scale=1,ox=0,oy=0;function resize(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;scale=Math.min(c.width/W,c.height/H);ox=(c.width-W*scale)/2;oy=(c.height-H*scale)/2}onresize=resize;resize();let x=180,target=180,vx=0,n=1,hp=100,score=0,wave=1,t=0,spawn=0,bonus=0,fire=0,weapon=0,run=false,paused=false,en=[],bul=[],items=[],fx=[],last=0;const guns=[['PISTOLA',.36,1,1],['FUCILE',.18,1,1],['POMPA',.48,1,5],['MINIGUN',.07,1,1],['RAZZI',.55,5,1],['LASER',.13,3,1]];const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){particles=[];shake=muzzle=0;document.querySelector('#arcade').style.display='none';formation=0;bossKills=walls=bonuses=0;document.querySelector('#formation').style.display='block';document.querySelector('#formation').textContent='LINEA';document.querySelector('#ranking').style.display='none';document.querySelector('#recordForm').style.display='none';document.querySelector('#start').style.display='';nextBoss=30;x=target=180;vx=0;n=1;hp=100;score=0;wave=1;t=spawn=fire=weapon=0;bonus=0;en=[];bul=[];items=[];fx=[];run=true;paused=false;overlay.style.display='none'}document.querySelector('#start').onclick=reset;document.querySelector('#pause').onclick=()=>{if(run){paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'}};function move(e){target=cl((e.clientX*(devicePixelRatio||1)-ox)/scale,35,325)}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')move(e)};onkeydown=e=>{if(e.key==='ArrowLeft')target-=45;if(e.key==='ArrowRight')target+=45;target=cl(target,35,325)};function soldier(x,y,color,big=false,ally=false){g.save();g.translate(px(x,y),py(y));let z=depth(y)*(big?1.8:1);g.scale(z,z);x=0;y=0;g.fillStyle='#0005';g.beginPath();g.ellipse(x,y+8,9,5,0,0,7);g.fill();g.fillStyle=color;g.fillRect(x-6,y-5,12,14);g.fillStyle='#c5b99a';g.beginPath();g.arc(x,y-7,big?7:5,0,7);g.fill();g.fillStyle=color;g.fillRect(x-6,y-11,12,5);g.fillStyle='#252c2b';g.fillRect(x+5,y-14,4,18);if(ally){g.fillStyle='#243b4d';g.fillRect(-5,0,10,9);g.fillStyle='#59758b';g.fillRect(-5,-10,10,5)}g.restore()}function update(dt){updateEffects(dt);t+=dt;wave=1+Math.floor(t/18);let agility=1/(1+Math.min(n-1,60)*.004);let desired=cl((target-x)*7,-480,480)*agility;vx+=(desired-vx)*(1-Math.exp(-dt*10*agility));x+=vx*dt;if(x<0||x>360){x=cl(x,0,360);vx=0;}if(Math.abs(target-x)<.25&&Math.abs(vx)<3){x=target;vx=0;}spawn-=dt;bonus-=dt;fire-=dt;if(spawn<=0){spawn=t<15?1.8:t<30?1.15:Math.max(.25,1.1-wave*.055);let count=t<15?1:t<30?2:Math.min(16,2+Math.floor(wave/2)+Math.floor(Math.sqrt(n)/3));for(let i=0;i<count;i++){let boss=false;let life=boss?20+wave*3:1+Math.floor(wave/3);en.push({x:(t<15?cl(x+rnd(-45,45),28,332):rnd(28,332)),y:-20-i*13,h:life,max:life,v:(t<15?rnd(28,42):rnd(40,65))+Math.min(85,wave*2),boss})}}if(t>=nextBoss){nextBoss+=Math.max(8,13-wave*.3);for(let i=0;i<Math.min(4,1+Math.floor(wave/4));i++){let life=Math.ceil(12+wave*5+Math.min(n,24)*guns[weapon][2]*2);en.push({x:rnd(55,305),y:25-i*45,h:life,max:life,v:65+wave,boss:true})}}if(bonus<=0){bonus=t<20?5:rnd(6,8);let side=Math.random()<.5?95:265,other=360-side;let gun=guns[weapon];function wall(width){let r=Math.random(),factor=r<.25?rnd(.18,.32):r<.65?rnd(.38,.60):r<.95?rnd(.75,1.05):rnd(1.6,2.3);if(t<20)factor=.18;return Math.max(2,Math.ceil(Math.min(n,24)*gun[3]/gun[1]*5.5*factor*Math.min(1,width/Math.max(35,Math.min(100,n*13)))))}let hits=wall(70);items.push({kind:'gun',v:1+Math.floor(rnd(0,5)),x:side,y:-35,hits,maxHits:hits});let pos=[{kind:'add',v:5},{kind:'add',v:10},{kind:'mul',v:2},{kind:'mul',v:3},{kind:'heal',v:12}],neg=[{kind:'add',v:-5},{kind:'add',v:-10},{kind:'div',v:2},{kind:'div',v:3}];let lane=t<1?180:cl(other+rnd(-22,22),35,325);for(let i=0;i<(t<20?2:3);i++){let pool=t>=20&&i>0&&Math.random()<.55?neg:pos;let a=t<6?{kind:'add',v:i===0?5:3}:pool[Math.floor(rnd(0,pool.length))];let xx=i===0?lane:cl(lane+(Math.random()<.65?0:(Math.random()<.5?-1:1)*rnd(45,65)),35,325);let h=t>=12&&pool!==neg&&Math.random()<.45?wall(44):0;items.push({...a,x:xx,y:-35-i*44,hits:h,maxHits:h})}}if(fire<=0){let gun=guns[weapon];fire=gun[1];muzzle=.07;let count=Math.min(n,24);for(let i=0;i<count;i++)for(let j=0;j<gun[3];j++)bul.push({x:slot(i,count).x,y:slot(i,count).y-15,vx:(j-(gun[3]-1)/2)*65,d:gun[2]*Math.max(1,Math.sqrt(n/count)),w:weapon})}for(let b of bul){b.y-=dt*450;b.x+=b.vx*dt;for(let a of items){if(a.hits>0&&Math.abs(a.x-b.x)<(a.kind==='gun'?35:22)&&Math.abs(a.y-b.y)<15){a.hits--;if(a.hits===0){walls++;burst(a.x,a.y,18,1.4);}fx.push({x:b.x,y:a.y,t:.12});b.y=-100;break}}if(b.y<0)continue;for(let e of en){if(e.h>0&&Math.abs(e.x-b.x)<(e.boss?17:10)&&Math.abs(e.y-b.y)<14){e.h-=b.d;if(b.w===4){for(let q of en)if(q!==e&&Math.hypot(q.x-e.x,q.y-e.y)<45)q.h-=b.d*.6}fx.push({x:e.x,y:e.y,t:.25});if(e.h<=0)burst(e.x,e.y,e.boss?28:8,e.boss?2:1);b.y=-100;break}}}bul=bul.filter(b=>b.y>-20);for(let e of en){e.y+=e.v*dt;if(e.h<=0){score+=e.boss?100:10;if(e.boss)bossKills++}else if(e.y>535){hp-=e.boss?20:t<20?3:5;n=Math.max(0,n-(e.boss?4:1));e.h=-999}}en=en.filter(e=>e.h>0);for(let a of items){a.y+=dt*72;if(a.hits>0&&!a.used){if(a.y>=515&&a.y<=610){let count=Math.min(n,36),cols=Math.min(6,count),hit=0;for(let i=0;i<count;i++){let p=slot(i,count),sx=p.x,sy=p.y;if(Math.abs(sx-a.x)<(a.kind==='gun'?35:22)+5&&Math.abs(sy-a.y)<22)hit++;}if(hit){let lost=Math.min(n,Math.max(1,Math.round(n*hit/count)));n-=lost;fx.push({x:a.x,y:a.y,t:.35});a.used=true;continue;}}continue;}if(a.y>520&&a.y<542&&Math.abs(a.x-x)<(a.kind==='gun'?35:22)&&!a.used){bonuses++;if(a.kind==='add')n=Math.max(1,n+a.v);if(a.kind==='mul')n=Math.min(999,n*a.v);if(a.kind==='div')n=Math.max(1,Math.floor(n/a.v));if(a.kind==='heal')hp=Math.min(100,hp+a.v);if(a.kind==='gun')weapon=a.v;a.used=true}}items=items.filter(a=>!a.used&&a.y<615);for(let f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);checkMedals();if(hp<=0||n<=0){run=false;saveLifetime();document.querySelector('#toast').style.display='none';document.querySelector('#formation').style.display='none';overlay.style.display='grid';msg.innerHTML='Ondata '+wave+' • '+score+' punti<br>Soldati rimasti: '+n;document.querySelector('#start').textContent='RIPROVA';finishRecord()}}const depth=y=>.42+.66*cl(y/640,0,1),px=(x,y)=>180+(x-180)*depth(y),py=y=>65+565*Math.pow(cl(y/640,0,1.2),1.12);function draw(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#101817';g.fillRect(0,0,c.width,c.height);g.setTransform(scale,0,0,scale,ox+(shake>0?(Math.random()-.5)*shake*scale:0),oy);g.fillStyle='#4c5a45';g.fillRect(0,0,W,H);g.fillStyle='#626865';g.beginPath();g.moveTo(px(17,0),65);g.lineTo(px(343,0),65);g.lineTo(360,640);g.lineTo(0,640);g.fill();g.strokeStyle='#b8b5a0';g.lineWidth=2;for(let edge of [17,343]){g.beginPath();g.moveTo(px(edge,0),65);g.lineTo(px(edge,640),640);g.stroke()}g.fillStyle='#92958b';for(let y=(t*45)%50;y<H;y+=50)g.fillRect(179,py(y),2,18*depth(y));for(let a of items){if(a.y<0)continue;g.save();g.translate(px(a.x,a.y),py(a.y));g.scale(depth(a.y),depth(a.y));let ax=a.x,ay=a.y;a.x=0;a.y=0;let w=a.kind==='gun'?70:44;g.fillStyle=a.hits>0?'#765b43':a.kind==='gun'?'#9a7028dd':a.kind==='div'||a.v<0?'#b52e35':'#278b51';g.fillRect(-w/2,-19,w,38);g.strokeStyle='#e1e8dc';g.strokeRect(-w/2,-19,w,38);g.fillStyle='white';g.font=a.kind==='gun'?'bold 11px system-ui':'bold 16px system-ui';g.textAlign='center';g.fillText(a.kind==='gun'?guns[a.v][0]:a.kind==='mul'?'×'+a.v:a.kind==='div'?'÷'+a.v:a.kind==='heal'?'♥+'+a.v:(a.v>0?'+':'')+a.v,a.x,a.y+6);if(a.hits>0){g.fillStyle='#493a30';g.fillRect(-w/2,-19,w,38);g.strokeStyle='#bba48b';g.strokeRect(-w/2,-19,w,38);g.beginPath();g.moveTo(-w/2,0);g.lineTo(w/2,0);g.stroke();g.fillStyle='white';g.font='bold 16px system-ui';g.fillText(a.hits,0,-2,w-4);g.font='bold 10px system-ui';g.fillText(a.kind==='gun'?guns[a.v][0]:a.kind==='mul'?'×'+a.v:a.kind==='heal'?'♥+'+a.v:'+'+a.v,0,13,w-4)}a.x=ax;a.y=ay;g.restore()}for(let e of en){if(e.y<0)continue;soldier(e.x,e.y,e.boss?'#6b173c':'#9b3934',e.boss);if(e.boss){g.fillStyle='#ffcf65';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('BOSS',px(e.x,e.y),py(e.y)-38);}if(e.max>1){g.fillStyle='#2c2925';g.fillRect(px(e.x,e.y)-10,py(e.y)-(e.boss?32:19),20,3);g.fillStyle='#ef795a';g.fillRect(px(e.x,e.y)-10,py(e.y)-(e.boss?32:19),20*e.h/e.max,3)}}for(let b of bul){g.fillStyle=b.w===5?'#80f5ff':'#ffe49a';g.shadowColor=g.fillStyle;g.shadowBlur=7;g.fillRect(px(b.x,b.y),py(b.y),2,b.w===5?18:10);g.shadowBlur=0}for(let f of fx){g.fillStyle='#ffca69';g.beginPath();g.arc(px(f.x,f.y),py(f.y),3+f.t*20,0,7);g.fill()}let count=Math.min(n,36),cols=Math.min(6,count);for(let i=0;i<count;i++){let p=slot(i,count);soldier(p.x,p.y,'#315e86',false,true)};g.fillStyle='#e0e8dc';g.font='bold 13px system-ui';g.textAlign='center';drawEffects();g.fillText(n+' SOLDATI • '+guns[weapon][0],180,625);hud.innerHTML='<span>ONDATA '+wave+'<br>VITA '+Math.max(0,hp)+'%</span><span>'+score+' PTS'+(en.some(e=>e.boss)?'<br>⚠ BOSS':'')+'</span>';if(paused){g.fillStyle='#0009';g.fillRect(0,0,W,H);g.fillStyle='white';g.font='bold 32px system-ui';g.fillText('PAUSA',180,320)}}function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(run&&!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

const seeds=[['Raven',100000,310],['Ghost',82000,270],['Viper',65000,240],['Wolf',51000,215],['Falcon',40000,190],['Echo',32000,175],['Atlas',25000,160],['Nomad',19000,145],['Hawk',15000,130],['Scout',11000,120]].map(([name,points,time])=>({name,points,time,demo:true}));
let records=seeds.slice();try{let a=JSON.parse(localStorage.getItem('endless-front-records-v2'));if(Array.isArray(a)&&a.length===10&&a.every(e=>typeof e.name==='string'&&Number.isFinite(e.points)&&Number.isFinite(e.time)))records=a}catch(e){}
const rankBox=document.querySelector('#ranking'),recordForm=document.querySelector('#recordForm'),startBtn=document.querySelector('#start');
function showRecords(){rankBox.dataset.mode='records';rankBox.replaceChildren();let heading=document.createElement('p');heading.textContent='TOP 10 • * record dimostrativi';rankBox.append(heading);records.forEach((r,i)=>{let line=document.createElement('div');line.style.cssText='display:flex;justify-content:space-between;gap:12px;padding:5px;border-bottom:1px solid #ffffff25;font-size:13px';let a=document.createElement('span'),b=document.createElement('span');a.textContent=(i+1)+'. '+r.name+(r.demo?' *':'');b.textContent=r.points+' • '+Math.floor(r.time/60)+':'+String(Math.floor(r.time%60)).padStart(2,'0');line.append(a,b);rankBox.append(line)});rankBox.style.display='block';addCloseRank() }
document.querySelector('#records').onclick=()=>{if(rankBox.style.display==='none'||rankBox.dataset.mode!=='records')showRecords();else rankBox.style.display='none'};
function finishRecord(){document.querySelector('#arcade').style.display='contents';renderArcade();if(score>records[9].points){let best=score>records[0].points;msg.textContent=(best?'NUOVO RECORD ASSOLUTO!':'SEI NELLA TOP 10!')+' • '+score+' punti';recordForm.style.display='block';startBtn.style.display='none';document.querySelector('#playerName').value='';}else showRecords()}
recordForm.onsubmit=e=>{e.preventDefault();let name=document.querySelector('#playerName').value.trim();if(!name)return;records.push({name,points:score,time:Math.floor(t),demo:false});records.sort((a,b)=>b.points-a.points);records=records.slice(0,10);try{localStorage.setItem('endless-front-records-v2',JSON.stringify(records));msg.textContent='Record salvato!'}catch(e){msg.textContent='Record salvato solo per questa sessione: memoria locale non disponibile.'}recordForm.style.display='none';startBtn.style.display='';renderArcade();showRecords()};

let formation=0,bossKills=0,walls=0,bonuses=0;
const formationNames=['LINEA','COLONNA','CUNEO','COMPATTA'];
function slot(i,count){let cols=formation===0?Math.min(12,count):formation===1?Math.min(2,count):Math.min(6,count);if(formation===2){let row=Math.floor(Math.sqrt(i)),j=i-row*row,k=Math.min(2*row+1,count-row*row);return {x:x+(j-(k-1)/2)*10,y:535+row*11}}let row=Math.floor(i/cols),k=Math.min(cols,count-row*cols);return {x:x+(i%cols-(k-1)/2)*(formation===3?9:13),y:535+row*(formation===1?5:11)}}
document.querySelector('#formation').onclick=()=>{if(run){formation=(formation+1)%4;document.querySelector('#formation').textContent=formationNames[formation];unlock('tactic')}};
const achievements=[['first','Primo sangue','10 punti',()=>score>=10],['minute','Veterano','60 secondi',()=>t>=60],['two','Resistenza','120 secondi',()=>t>=120],['five','Inarrestabile','5 minuti',()=>t>=300],['ten','Maratoneta','10 minuti',()=>t>=600],['boss','Cacciatore di boss','1 boss',()=>bossKills>=1],['boss5','Ammazzagiganti','5 boss',()=>bossKills>=5],['boss20','Incubo dei boss','20 boss',()=>bossKills>=20],['wall','Demolitore','1 muro',()=>walls>=1],['wall10','Ruspa','10 muri',()=>walls>=10],['wall50','Terremoto','50 muri',()=>walls>=50],['bonus10','Collezionista','10 bonus',()=>bonuses>=10],['bonus50','Tesoro di guerra','50 bonus',()=>bonuses>=50],['army10','Squadra','10 soldati',()=>n>=10],['army50','Plotone','50 soldati',()=>n>=50],['army100','Compagnia','100 soldati',()=>n>=100],['army500','Legione','500 soldati',()=>n>=500],['score1','Mille punti','1.000 punti',()=>score>=1000],['score10','Élite','10.000 punti',()=>score>=10000],['score50','Generale','50.000 punti',()=>score>=50000],['score100','Leggenda','100.000 punti',()=>score>=100000],['rank','Hall of fame','Supera il decimo',()=>score>records[9].points],['top','Re del fronte','Supera il primo',()=>score>records[0].points],['tactic','Stratega','Cambia formazione',()=>false],['laser','Futuro','Ottieni il laser',()=>weapon===5],['rocket','Artiglieria','Ottieni i razzi',()=>weapon===4],['mini','Tempesta di piombo','Ottieni la minigun',()=>weapon===3]];
let earned=new Set();try{earned=new Set(JSON.parse(localStorage.getItem('ef-medals-v1')||'[]'))}catch(e){}
let notices=[],noticeUntil=0;
const lifetime={games:0,points:0,boss:0,walls:0,seconds:0};try{Object.assign(lifetime,JSON.parse(localStorage.getItem('ef-lifetime')||'{}'))}catch(e){}
achievements.push(['games10','Recluta fedele','10 partite',()=>lifetime.games>=10],['games100','Veterano di guerra','100 partite',()=>lifetime.games>=100],['games500','Immortale','500 partite',()=>lifetime.games>=500],['million','Milionario','1.000.000 punti cumulativi',()=>lifetime.points+score>=1000000],['boss500','Flagello','500 boss cumulativi',()=>lifetime.boss+bossKills>=500],['walls1000','Assedio eterno','1.000 muri cumulativi',()=>lifetime.walls+walls>=1000],['hour10','Dieci ore al fronte','10 ore cumulative',()=>lifetime.seconds+t>=36000],['twenty','Ultimo superstite','20 minuti in una partita',()=>t>=1200],['score250','Imperatore','250.000 punti in una partita',()=>score>=250000]);
const tiers=[['Bronzo','#b77b49'],['Argento','#b8c8d6'],['Oro','#e5ba51'],['Platino','#73d9e5'],['Leggendaria','#c18af8']];
function tier(id){return ['games500','million','boss500','hour10','score250','twenty'].includes(id)?4:['games100','walls1000','boss20','score100','top','ten','army500'].includes(id)?3:['five','boss5','wall50','bonus50','army100','score50','rank'].includes(id)?2:['two','wall10','bonus10','army50','score10','games10','laser','rocket','mini'].includes(id)?1:0}
function renderArcade(){let a=document.querySelector('#arcadeRecords'),b=document.querySelector('#arcadeMedals');a.replaceChildren();b.replaceChildren();let h=document.createElement('h3');h.textContent='HIGH SCORES';h.style.color='#d6b66b';a.append(h);records.forEach((r,i)=>{let d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;padding:3px 8px;font: bold 13px monospace;color:'+(i===0?'#ffda79':'#eee');let l=document.createElement('span'),v=document.createElement('span');l.textContent=String(i+1).padStart(2,'0')+' '+r.name+(r.demo?' *':'');v.textContent=String(r.points).padStart(6,'0');d.append(l,v);a.append(d)});let m=document.createElement('h3');m.textContent='MEDAGLIE '+earned.size+'/'+achievements.length;m.style.color='#d6b66b';b.append(m);let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(6,1fr);gap:6px';for(let item of achievements){let level=tier(item[0]),got=earned.has(item[0]),d=document.createElement('button');d.style.cssText='padding:3px;height:45px;background:#222b27;border:1px solid '+tiers[level][1]+';color:'+tiers[level][1]+';opacity:'+(got?1:.38);d.textContent=got?'✪':'◇';d.title=item[1];d.onclick=()=>{msg.textContent=item[1]+' • '+tiers[level][0]+' • '+item[2]};grid.append(d)}b.append(grid)}
function saveLifetime(){lifetime.games++;lifetime.points+=score;lifetime.boss+=bossKills;lifetime.walls+=walls;lifetime.seconds+=t;try{localStorage.setItem('ef-lifetime',JSON.stringify(lifetime))}catch(e){}for(let a of achievements)if(['games10','games100','games500'].includes(a[0])&&a[3]())unlock(a[0])}

function unlock(id){if(earned.has(id))return;earned.add(id);try{localStorage.setItem('ef-medals-v1',JSON.stringify([...earned]))}catch(e){}let a=achievements.find(a=>a[0]===id);if(a)notices.push(a)}
function checkMedals(){for(let a of achievements)if(!earned.has(a[0])&&a[3]())unlock(a[0]);let box=document.querySelector('#toast'),now=performance.now();if(now>=noticeUntil){if(notices.length){let a=notices.shift();box.textContent='🏅 MEDAGLIA SBLOCCATA • '+a[1]+' — '+a[2];box.style.display='block';noticeUntil=now+2600}else box.style.display='none'}}
document.querySelector('#medals').onclick=()=>{if(rankBox.dataset.mode==='medals'&&rankBox.style.display!=='none'){rankBox.style.display='none';return}rankBox.dataset.mode='medals';rankBox.replaceChildren();let h=document.createElement('p');h.textContent='MEDAGLIE '+earned.size+'/'+achievements.length;rankBox.append(h);for(let a of achievements){let d=document.createElement('div');d.style.cssText='padding:7px;border-bottom:1px solid #ffffff25;font-size:13px;opacity:'+(earned.has(a[0])?1:.55);d.style.color=tiers[tier(a[0])][1];d.textContent=(earned.has(a[0])?'🏅 ':'🔒 ')+a[1]+' • '+tiers[tier(a[0])][0]+' • '+a[2];rankBox.append(d)}rankBox.style.display='block';addCloseRank() };
let particles=[],muzzle=0,shake=0;
function burst(x,y,count,power){shake=Math.max(shake,4*power);for(let i=0;i<count;i++){let angle=Math.random()*Math.PI*2,speed=rnd(15,95)*power;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:rnd(.25,.9),max:1,r:rnd(1,5)*power,smoke:i%3===0})}if(particles.length>500)particles.splice(0,particles.length-500)}
function updateEffects(dt){muzzle=Math.max(0,muzzle-dt);shake=Math.max(0,shake-dt*22);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}particles=particles.filter(p=>p.life>0)}
function drawEffects(){g.save();for(let p of particles){g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.smoke?'#62645d':p.life>.35?'#fff0a0':'#e97b36';g.beginPath();g.arc(px(p.x,p.y),py(p.y),p.r*(p.smoke?2:1),0,Math.PI*2);g.fill()}g.globalAlpha=1;if(muzzle>0){for(let i=0;i<Math.min(n,24);i++){let p=slot(i,Math.min(n,24));g.fillStyle='#fff2a5';g.shadowColor='#ff9e39';g.shadowBlur=10;g.beginPath();g.arc(px(p.x+5,p.y-18),py(p.y-18),3+Math.random()*3,0,7);g.fill()}}g.restore()}
function addCloseRank(){let close=document.createElement('button');close.textContent='CHIUDI';close.style.cssText='position:sticky;top:0;display:block;margin:0 auto 8px;z-index:2';close.onclick=()=>rankBox.style.display='none';rankBox.prepend(close)}

function medalArt(a){let color=tiers[tier(a[0])][1],got=earned.has(a[0]);return '<svg viewBox="0 0 60 66" aria-hidden="true"><path d="M12 2 H24 L30 19 L36 2 H48 L38 28 H22Z" fill="'+color+'" opacity=".8"/><circle cx="30" cy="43" r="20" fill="#17211c" stroke="'+color+'" stroke-width="3"/><circle cx="30" cy="43" r="16" fill="none" stroke="'+color+'" opacity=".5"/><path d="M30 30 L34 39 L44 39 L36 45 L39 55 L30 49 L21 55 L24 45 L16 39 L26 39Z" fill="'+color+'"/></svg>'}
renderArcade=function(){let a=document.querySelector('#arcadeRecords'),b=document.querySelector('#arcadeMedals');a.innerHTML='<h3>HIGH SCORES</h3><div class="scoreWindow"><div class="scoreTrack"></div></div><span class="hint">TOCCA PER APRIRE LA CLASSIFICA</span>';let track=a.querySelector('.scoreTrack');for(let pass=0;pass<2;pass++){records.forEach((r,i)=>{let d=document.createElement('div');d.className='scoreRow';d.style.color=i===0?'#e8ca82':'#eee';let l=document.createElement('span'),v=document.createElement('span');l.textContent=String(i+1).padStart(2,'0')+' '+r.name+(r.demo?' *':'');v.textContent=String(r.points).padStart(6,'0');d.append(l,v);track.append(d)})}b.innerHTML='<h3>MEDAGLIE '+earned.size+'/'+achievements.length+'</h3><div class="previewWindow"><div class="medalTrack"></div></div><span class="hint">TOCCA PER APRIRE IL MEDAGLIERE</span>';let mt=b.querySelector('.medalTrack');let sorted=achievements.slice().sort((a,b)=>Number(earned.has(b[0]))-Number(earned.has(a[0])));for(let pass=0;pass<2;pass++){let cycle=document.createElement('div');cycle.className='medalCycle';for(let a of sorted){let tile=document.createElement('div');tile.className='medalTile';tile.style.opacity=earned.has(a[0])?1:.4;tile.innerHTML=medalArt(a);let label=document.createElement('span');label.textContent=a[1];tile.append(label);cycle.append(tile)}mt.append(cycle)}a.onclick=()=>showRecords();b.onclick=()=>document.querySelector('#medals').onclick();for(let el of [a,b])el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}};
renderArcade();
let demoClock=0;const originalDraw=draw;draw=function(){originalDraw();if(!run){demoClock+=.016;g.save();g.setTransform(scale,0,0,scale,ox,oy);for(let i=0;i<16;i++){let yy=(demoClock*65+i*61)%590;soldier(45+(i*71)%270,yy,'#9b3934',i%7===0)}for(let i=0;i<8;i++){soldier(120+i%4*35,530+Math.floor(i/4)*15,'#315e86',false,true);g.fillStyle='#ffda79';let yy=(640-(demoClock*420+i*85)%640);g.fillRect(px(120+i%4*35,yy),py(yy),2,12)}for(let i=0;i<5;i++){let phase=(demoClock*.7+i*.23)%1;g.globalAlpha=(1-phase)*.75;g.fillStyle='#ffaf51';g.beginPath();g.arc(px(65+i*53,220+i*37),py(220+i*37),4+phase*22,0,Math.PI*2);g.fill()}g.restore()}};
