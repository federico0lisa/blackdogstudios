const medalStyle36=document.createElement('style');medalStyle36.textContent=`
.medalPic36{display:inline-block;flex:none;width:52px;aspect-ratio:96/110;height:auto;background-image:url("${medalAtlas36}");background-size:800% 500%;background-repeat:no-repeat;vertical-align:middle;image-rendering:auto;border-radius:3px}
.medalTile .medalPic36{width:clamp(36px,8vh,48px);height:auto;aspect-ratio:96/110}
.medalList36{display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #ffffff25;text-align:left}
.medalList36 strong{display:block;font-size:14px}.medalList36 small{display:block;font-size:12px;color:#e2d8ba;margin-top:3px}
.medalHeading36{padding:12px 6px 4px;text-align:left;letter-spacing:2px;font-size:15px}
#medalToast36{display:none;position:fixed;top:18%;left:50%;width:min(330px,84vw);max-height:54vh;transform:translateX(-50%);z-index:1000;background:linear-gradient(145deg,#20281e,#090e0b);border:2px solid var(--medalcolor);box-shadow:0 0 32px var(--medalcolor),0 8px 25px #000b;border-radius:12px;overflow:hidden;pointer-events:none;padding:10px 8px;text-align:center}
#medalToast36.active36{animation:medalArrival36 2.6s both}
#medalToast36 .medalPic36{width:clamp(86px,26vw,110px);max-width:34vh;height:auto;aspect-ratio:96/110;display:block;margin:5px auto;image-rendering:auto;filter:drop-shadow(0 0 5px var(--medalcolor));animation:medalGlow36 1s ease-out both}
.medalTitle36{font-weight:900;font-size:15px;letter-spacing:1.6px;color:var(--medalcolor);text-shadow:0 1px 2px #000}
.medalName36{font-weight:900;font-size:21px;color:#fff1cf}
.medalGoal36{font-size:12px;color:#e3d8bd;margin-top:4px}
@keyframes medalArrival36{0%{opacity:0;transform:translateX(-50%) scale(.65)}12%{opacity:1;transform:translateX(-50%) scale(1.03)}20%,82%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.92)}}
@keyframes medalGlow36{0%{transform:scale(.6);filter:brightness(2.2) drop-shadow(0 0 12px var(--medalcolor))}45%{transform:scale(1.08)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#medalToast36.active36,#medalToast36 .medalPic36{animation:none}}

medalArt=function(a){let row=medalRows36.findIndex(r=>r.includes(a[0]));if(row<0)return '';let col=medalRows36[row].indexOf(a[0]);return '<span aria-hidden="true" class="medalPic36" style="background-position:'+(col/7*100)+'% '+(row/4*100)+'%"></span>'};
