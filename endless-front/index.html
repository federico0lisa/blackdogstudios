<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Endless Front 0.7</title><style>*{box-sizing:border-box}body{margin:0;background:#101817;color:white;font: bold 15px system-ui;touch-action:none;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 3px black}button{background:#d6b66b;color:#17211c;border:0;border-radius:8px;padding:12px 22px;font-weight:bold;font-size:16px}#pause{position:absolute;right:12px;top:55px;padding:8px 13px}#overlay{position:absolute;inset:0;background:#101817e8;display:grid;place-content:center;text-align:center;padding:30px}h1{font-size:38px;letter-spacing:3px;margin:0;color:#d6b66b}p{line-height:1.6;font-weight:normal}small{color:#a7b5aa}</style><canvas id="c"></canvas><div id="hud"></div><button id="pause">Ⅱ</button><div id="overlay"><small>BLACK DOG STUDIOS</small><h1>ENDLESS FRONT</h1><p id="msg">Trascina il dito per muovere la squadra.<br>Sparo automatico. Distruggi i muri a colpi di arma o raccogli i bonus sull’altro lato. Non lasciare passare i nemici.</p><button id="start">GIOCA</button><p><small>PROTOTIPO 0.7 • OFFLINE</small></p></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),hud=document.querySelector('#hud'),overlay=document.querySelector('#overlay'),msg=document.querySelector('#msg');let nextBoss=30;let W=360,H=640,scale=1,ox=0,oy=0;function resize(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;scale=Math.min(c.width/W,c.height/H);ox=(c.width-W*scale)/2;oy=(c.height-H*scale)/2}onresize=resize;resize();let x=180,target=180,vx=0,n=1,hp=100,score=0,wave=1,t=0,spawn=0,bonus=0,fire=0,weapon=0,run=false,paused=false,en=[],bul=[],items=[],fx=[],last=0;const guns=[['PISTOLA',.36,1,1],['FUCILE',.18,1,1],['POMPA',.48,1,5],['MINIGUN',.07,1,1],['RAZZI',.55,5,1],['LASER',.13,3,1]];const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){nextBoss=30;x=target=180;vx=0;n=1;hp=100;score=0;wave=1;t=spawn=fire=weapon=0;bonus=0;en=[];bul=[];items=[];fx=[];run=true;paused=false;overlay.style.display='none'}document.querySelector('#start').onclick=reset;document.querySelector('#pause').onclick=()=>{if(run){paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'}};function move(e){target=cl((e.clientX*(devicePixelRatio||1)-ox)/scale,35,325)}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);move(e)};c.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')move(e)};onkeydown=e=>{if(e.key==='ArrowLeft')target-=45;if(e.key==='ArrowRight')target+=45;target=cl(target,35,325)};function soldier(x,y,color,big=false,ally=false){g.save();g.translate(px(x,y),py(y));let z=depth(y)*(big?1.8:1);g.scale(z,z);x=0;y=0;g.fillStyle='#0005';g.beginPath();g.ellipse(x,y+8,9,5,0,0,7);g.fill();g.fillStyle=color;g.fillRect(x-6,y-5,12,14);g.fillStyle='#c5b99a';g.beginPath();g.arc(x,y-7,big?7:5,0,7);g.fill();g.fillStyle=color;g.fillRect(x-6,y-11,12,5);g.fillStyle='#252c2b';g.fillRect(x+5,y-14,4,18);if(ally){g.fillStyle='#243b4d';g.fillRect(-5,0,10,9);g.fillStyle='#59758b';g.fillRect(-5,-10,10,5)}g.restore()}function update(dt){t+=dt;wave=1+Math.floor(t/18);let agility=1/(1+Math.min(n-1,60)*.004);let desired=cl((target-x)*7,-480,480)*agility;vx+=(desired-vx)*(1-Math.exp(-dt*10*agility));x+=vx*dt;if(x<0||x>360){x=cl(x,0,360);vx=0;}if(Math.abs(target-x)<.25&&Math.abs(vx)<3){x=target;vx=0;}spawn-=dt;bonus-=dt;fire-=dt;if(spawn<=0){spawn=t<15?1.8:t<30?1.15:Math.max(.25,1.1-wave*.055);let count=t<15?1:t<30?2:Math.min(16,2+Math.floor(wave/2)+Math.floor(Math.sqrt(n)/3));for(let i=0;i<count;i++){let boss=false;let life=boss?20+wave*3:1+Math.floor(wave/3);en.push({x:(t<15?cl(x+rnd(-45,45),28,332):rnd(28,332)),y:-20-i*13,h:life,max:life,v:(t<15?rnd(28,42):rnd(40,65))+Math.min(85,wave*2),boss})}}if(t>=nextBoss){nextBoss+=Math.max(8,13-wave*.3);for(let i=0;i<Math.min(4,1+Math.floor(wave/4));i++){let life=Math.ceil(12+wave*5+Math.min(n,24)*guns[weapon][2]*2);en.push({x:rnd(55,305),y:25-i*45,h:life,max:life,v:65+wave,boss:true})}}if(bonus<=0){bonus=t<20?5:rnd(6,8);let side=Math.random()<.5?95:265,other=360-side;let gun=guns[weapon];function wall(width){let r=Math.random(),factor=r<.25?rnd(.18,.32):r<.65?rnd(.38,.60):r<.95?rnd(.75,1.05):rnd(1.6,2.3);if(t<20)factor=.18;return Math.max(2,Math.ceil(Math.min(n,24)*gun[3]/gun[1]*5.5*factor*Math.min(1,width/Math.max(35,Math.min(100,n*13)))))}let hits=wall(70);items.push({kind:'gun',v:1+Math.floor(rnd(0,5)),x:side,y:-35,hits,maxHits:hits});let pos=[{kind:'add',v:5},{kind:'add',v:10},{kind:'mul',v:2},{kind:'mul',v:3},{kind:'heal',v:12}],neg=[{kind:'add',v:-5},{kind:'add',v:-10},{kind:'div',v:2},{kind:'div',v:3}];let lane=t<1?180:cl(other+rnd(-22,22),35,325);for(let i=0;i<(t<20?2:3);i++){let pool=t>=20&&i>0&&Math.random()<.55?neg:pos;let a=t<6?{kind:'add',v:i===0?5:3}:pool[Math.floor(rnd(0,pool.length))];let xx=i===0?lane:cl(lane+(Math.random()<.65?0:(Math.random()<.5?-1:1)*rnd(45,65)),35,325);let h=t>=12&&pool!==neg&&Math.random()<.45?wall(44):0;items.push({...a,x:xx,y:-35-i*44,hits:h,maxHits:h})}}if(fire<=0){let gun=guns[weapon];fire=gun[1];let count=Math.min(n,24);for(let i=0;i<count;i++)for(let j=0;j<gun[3];j++)bul.push({x:x+(i-(count-1)/2)*Math.min(13,100/count),y:520-Math.floor(i/6)*12,vx:(j-(gun[3]-1)/2)*65,d:gun[2]*Math.max(1,Math.sqrt(n/count)),w:weapon})}for(let b of bul){b.y-=dt*450;b.x+=b.vx*dt;for(let a of items){if(a.hits>0&&Math.abs(a.x-b.x)<(a.kind==='gun'?35:22)&&Math.abs(a.y-b.y)<15){a.hits--;fx.push({x:b.x,y:a.y,t:.12});b.y=-100;break}}if(b.y<0)continue;for(let e of en){if(e.h>0&&Math.abs(e.x-b.x)<(e.boss?17:10)&&Math.abs(e.y-b.y)<14){e.h-=b.d;if(b.w===4){for(let q of en)if(q!==e&&Math.hypot(q.x-e.x,q.y-e.y)<45)q.h-=b.d*.6}fx.push({x:e.x,y:e.y,t:.18});b.y=-100;break}}}bul=bul.filter(b=>b.y>-20);for(let e of en){e.y+=e.v*dt;if(e.h<=0){score+=e.boss?100:10}else if(e.y>535){hp-=e.boss?20:t<20?3:5;n=Math.max(0,n-(e.boss?4:1));e.h=-999}}en=en.filter(e=>e.h>0);for(let a of items){a.y+=dt*72;if(a.hits>0&&!a.used){if(a.y>=515&&a.y<=610){let count=Math.min(n,36),cols=Math.min(6,count),hit=0;for(let i=0;i<count;i++){let sx=x+(i%cols-(cols-1)/2)*13,sy=535+Math.floor(i/cols)*11;if(Math.abs(sx-a.x)<(a.kind==='gun'?35:22)+5&&Math.abs(sy-a.y)<22)hit++;}if(hit){let lost=Math.min(n,Math.max(1,Math.round(n*hit/count)));n-=lost;fx.push({x:a.x,y:a.y,t:.35});a.used=true;continue;}}continue;}if(a.y>520&&a.y<542&&Math.abs(a.x-x)<(a.kind==='gun'?35:22)&&!a.used){if(a.kind==='add')n=Math.max(1,n+a.v);if(a.kind==='mul')n=Math.min(999,n*a.v);if(a.kind==='div')n=Math.max(1,Math.floor(n/a.v));if(a.kind==='heal')hp=Math.min(100,hp+a.v);if(a.kind==='gun')weapon=a.v;a.used=true}}items=items.filter(a=>!a.used&&a.y<615);for(let f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);if(hp<=0||n<=0){run=false;overlay.style.display='grid';msg.innerHTML='Ondata '+wave+' • '+score+' punti<br>Soldati rimasti: '+n;document.querySelector('#start').textContent='RIPROVA'}}const depth=y=>.42+.66*cl(y/640,0,1),px=(x,y)=>180+(x-180)*depth(y),py=y=>65+565*Math.pow(cl(y/640,0,1.2),1.12);function draw(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#101817';g.fillRect(0,0,c.width,c.height);g.setTransform(scale,0,0,scale,ox,oy);g.fillStyle='#4c5a45';g.fillRect(0,0,W,H);g.fillStyle='#626865';g.beginPath();g.moveTo(px(17,0),65);g.lineTo(px(343,0),65);g.lineTo(360,640);g.lineTo(0,640);g.fill();g.strokeStyle='#b8b5a0';g.lineWidth=2;for(let edge of [17,343]){g.beginPath();g.moveTo(px(edge,0),65);g.lineTo(px(edge,640),640);g.stroke()}g.fillStyle='#92958b';for(let y=(t*45)%50;y<H;y+=50)g.fillRect(179,py(y),2,18*depth(y));for(let a of items){if(a.y<0)continue;g.save();g.translate(px(a.x,a.y),py(a.y));g.scale(depth(a.y),depth(a.y));let ax=a.x,ay=a.y;a.x=0;a.y=0;let w=a.kind==='gun'?70:44;g.fillStyle=a.hits>0?'#765b43':a.kind==='gun'?'#9a7028dd':a.kind==='div'||a.v<0?'#b52e35':'#278b51';g.fillRect(-w/2,-19,w,38);g.strokeStyle='#e1e8dc';g.strokeRect(-w/2,-19,w,38);g.fillStyle='white';g.font=a.kind==='gun'?'bold 11px system-ui':'bold 16px system-ui';g.textAlign='center';g.fillText(a.kind==='gun'?guns[a.v][0]:a.kind==='mul'?'×'+a.v:a.kind==='div'?'÷'+a.v:a.kind==='heal'?'♥+'+a.v:(a.v>0?'+':'')+a.v,a.x,a.y+6);if(a.hits>0){g.fillStyle='#493a30';g.fillRect(-w/2,-19,w,38);g.strokeStyle='#bba48b';g.strokeRect(-w/2,-19,w,38);g.beginPath();g.moveTo(-w/2,0);g.lineTo(w/2,0);g.stroke();g.fillStyle='white';g.font='bold 16px system-ui';g.fillText(a.hits,0,-2,w-4);g.font='bold 10px system-ui';g.fillText(a.kind==='gun'?guns[a.v][0]:a.kind==='mul'?'×'+a.v:a.kind==='heal'?'♥+'+a.v:'+'+a.v,0,13,w-4)}a.x=ax;a.y=ay;g.restore()}for(let e of en){if(e.y<0)continue;soldier(e.x,e.y,e.boss?'#6b173c':'#9b3934',e.boss);if(e.boss){g.fillStyle='#ffcf65';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('BOSS',px(e.x,e.y),py(e.y)-38);}if(e.max>1){g.fillStyle='#2c2925';g.fillRect(px(e.x,e.y)-10,py(e.y)-(e.boss?32:19),20,3);g.fillStyle='#ef795a';g.fillRect(px(e.x,e.y)-10,py(e.y)-(e.boss?32:19),20*e.h/e.max,3)}}for(let b of bul){g.fillStyle=b.w===5?'#80f5ff':'#ffe49a';g.fillRect(px(b.x,b.y),py(b.y),2,b.w===5?12:6)}for(let f of fx){g.fillStyle='#ffca69';g.beginPath();g.arc(px(f.x,f.y),py(f.y),3+f.t*20,0,7);g.fill()}let count=Math.min(n,36),cols=Math.min(6,count);for(let i=0;i<count;i++)soldier(x+(i%cols-(cols-1)/2)*13,535+Math.floor(i/cols)*11,'#315e86',false,true);g.fillStyle='#e0e8dc';g.font='bold 13px system-ui';g.textAlign='center';g.fillText(n+' SOLDATI • '+guns[weapon][0],180,625);hud.innerHTML='<span>ONDATA '+wave+'<br>VITA '+Math.max(0,hp)+'%</span><span>'+score+' PTS'+(en.some(e=>e.boss)?'<br>⚠ BOSS':'')+'</span>';if(paused){g.fillStyle='#0009';g.fillRect(0,0,W,H);g.fillStyle='white';g.font='bold 32px system-ui';g.fillText('PAUSA',180,320)}}function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(run&&!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
