function showRecords(){rankBox.dataset.mode='records';rankBox.replaceChildren();let heading=document.createElement('p');heading.textContent='TOP 10 • * record dimostrativi';rankBox.append(heading);records.forEach((r,i)=>{let line=document.createElement('div');line.style.cssText='display:flex;justify-content:space-between;gap:12px;padding:5px;border-bottom:1px solid #ffffff25;font-size:13px';let a=document.createElement('span'),b=document.createElement('span');a.textContent=(i+1)+'. '+r.name+(r.demo?' *':'');b.textContent=r.points+' • '+Math.floor(r.time/60)+':'+String(Math.floor(r.time%60)).padStart(2,'0');line.append(a,b);rankBox.append(line)});rankBox.style.display='block';addCloseRank() }
document.querySelector('#records').onclick=()=>{if(rankBox.style.display==='none'||rankBox.dataset.mode!=='records')showRecords();else rankBox.style.display='none'};
function finishRecord(){document.querySelector('#arcade').style.display='contents';renderArcade();if(score>records[9].points){let best=score>records[0].points;msg.textContent=(best?'NUOVO RECORD ASSOLUTO!':'SEI NELLA TOP 10!')+' • '+score+' punti';recordForm.style.display='block';startBtn.style.display='none';document.querySelector('#playerName').value='';}else showRecords()}
recordForm.onsubmit=e=>{e.preventDefault();let name=document.querySelector('#playerName').value.trim();if(!name)return;records.push({name,points:score,time:Math.floor(t),demo:false});records.sort((a,b)=>b.points-a.points);records=records.slice(0,10);try{localStorage.setItem('endless-front-records-v2',JSON.stringify(records));msg.textContent='Record salvato!'}catch(e){msg.textContent='Record salvato solo per questa sessione: memoria locale non disponibile.'}recordForm.style.display='none';startBtn.style.display='';renderArcade();showRecords()};

let formation=0,bossKills=0,walls=0,bonuses=0;
const formationNames=['LINEA','COLONNA','CUNEO','COMPATTA'];
function slot(i,count){let cols=formation===0?Math.min(12,count):formation===1?Math.min(2,count):Math.min(6,count);if(formation===2){let row=Math.floor(Math.sqrt(i)),j=i-row*row,k=Math.min(2*row+1,count-row*row);return {x:x+(j-(k-1)/2)*10,y:535+row*11}}let row=Math.floor(i/cols),k=Math.min(cols,count-row*cols);return {x:x+(i%cols-(k-1)/2)*(formation===3?9:13),y:535+row*(formation===1?5:11)}}
document.querySelector('#formation').onclick=()=>{if(run){formation=(formation+1)%4;document.querySelector('#formation').textContent=formationNames[formation];unlock('tactic')}};
const achievements=[['first','Primo sangue','10 punti',()=>score>=10],['minute','Veterano','60 secondi',()=>t>=60],['two','Resistenza','120 secondi',()=>t>=120],['five','Inarrestabile','5 minuti',()=>t>=300],['ten','Maratoneta','10 minuti',()=>t>=600],['boss','Cacciatore di boss','1 boss',()=>bossKills>=1],['boss5','Ammazzagiganti','5 boss',()=>bossKills>=5],['boss20','Incubo dei boss','20 boss',()=>bossKills>=20],['wall','Demolitore','1 muro',()=>walls>=1],['wall10','Ruspa','10 muri',()=>walls>=10],['wall50','Terremoto','50 muri',()=>walls>=50],['bonus10','Collezionista','10 bonus',()=>bonuses>=10],['bonus50','Tesoro di guerra','50 bonus',()=>bonuses>=50],['army10','Squadra','10 soldati',()=>n>=10],['army50','Plotone','50 soldati',()=>n>=50],['army100','Compagnia','100 soldati',()=>n>=100],['army500','Legione','500 soldati',()=>n>=500],['score1','Mille punti','1.000 punti',()=>score>=1000],['score10','Élite','10.000 punti',()=>score>=10000],['score50','Generale','50.000 punti',()=>score>=50000],['score100','Leggenda','100.000 punti',()=>score>=100000],['rank','Hall of fame','Supera il decimo',()=>score>records[9].points],['top','Re del fronte','Supera il primo',()=>score>records[0].points],['tactic','Stratega','Cambia formazione',()=>false],['laser','Futuro','Ottieni il laser',()=>weapon===5],['rocket','Artiglieria','Ottieni i razzi',()=>weapon===4],['mini','Tempesta di piombo','Ottieni la minigun',()=>weapon===3]];
let earned=new Set();try{earned=new Set(JSON.parse(localStorage.getItem('ef-medals-v1')||'[]'))}catch(e){}
let notices=[],noticeUntil=0;
const lifetime={games:0,points:0,boss:0,walls:0,seconds:0};try{Object.assign(lifetime,JSON.parse(localStorage.getItem('ef-lifetime')||'{}'))}catch(e){}
achievements.push(['games10','Recluta fedele','10 partite',()=>lifetime.games>=10],['games100','Veterano di guerra','100 partite',()=>lifetime.games>=100],['games500','Immortale','500 partite',()=>lifetime.games>=500],['million','Milionario','1.000.000 punti cumulativi',()=>lifetime.points+score>=1000000],['boss500','Flagello','500 boss cumulativi',()=>lifetime.boss+bossKills>=500],['walls1000','Assedio eterno','1.000 muri cumulativi',()=>lifetime.walls+walls>=1000],['hour10','Dieci ore al fronte','10 ore cumulative',()=>lifetime.seconds+t>=36000],['twenty','Ultimo superstite','20 minuti in una partita',()=>t>=1200],['score250','Imperatore','250.000 punti in una partita',()=>score>=250000]);
const tiers=[['Bronzo','#b77b49'],['Argento','#b8c8d6'],['Oro','#e5ba51'],['Platino','#73d9e5'],['Leggendaria','#c18af8']];
function tier(id){return ['games500','million','boss500','hour10','score250','twenty'].includes(id)?4:['games100','walls1000','boss20','score100','top','ten','army500'].includes(id)?3:['five','boss5','wall50','bonus50','army100','score50','rank'].includes(id)?2:['two','wall10','bonus10','army50','score10','games10','laser','rocket','mini'].includes(id)?1:0}
function renderArcade(){let a=document.querySelector('#arcadeRecords'),b=document.querySelector('#arcadeMedals');a.replaceChildren();b.replaceChildren();let h=document.createElement('h3');h.textContent='HIGH SCORES';h.style.color='#d6b66b';a.append(h);records.forEach((r,i)=>{let d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;padding:3px 8px;font: bold 13px monospace;color:'+(i===0?'#ffda79':'#eee');let l=document.createElement('span'),v=document.createElement('span');l.textContent=String(i+1).padStart(2,'0')+' '+r.name+(r.demo?' *':'');v.textContent=String(r.points).padStart(6,'0');d.append(l,v);a.append(d)});let m=document.createElement('h3');m.textContent='MEDAGLIE '+earned.size+'/'+achievements.length;m.style.color='#d6b66b';b.append(m);let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(6,1fr);gap:6px';for(let item of achievements){let level=tier(item[0]),got=earned.has(item[0]),d=document.createElement('button');d.style.cssText='padding:3px;height:45px;background:#222b27;border:1px solid '+tiers[level][1]+';color:'+tiers[level][1]+';opacity:'+(got?1:.38);d.textContent=got?'✪':'◇';d.title=item[1];d.onclick=()=>{msg.textContent=item[1]+' • '+tiers[level][0]+' • '+item[2]};grid.append(d)}b.append(grid)}
function saveLifetime(){lifetime.games++;lifetime.points+=score;lifetime.boss+=bossKills;lifetime.walls+=walls;lifetime.seconds+=t;try{localStorage.setItem('ef-lifetime',JSON.stringify(lifetime))}catch(e){}for(let a of achievements)if(['games10','games100','games500'].includes(a[0])&&a[3]())unlock(a[0])}

function unlock(id){if(earned.has(id))return;earned.add(id);try{localStorage.setItem('ef-medals-v1',JSON.stringify([...earned]))}catch(e){}let a=achievements.find(a=>a[0]===id);if(a)notices.push(a)}
function checkMedals(){for(let a of achievements)if(!earned.has(a[0])&&a[3]())unlock(a[0]);let box=document.querySelector('#toast'),now=performance.now();if(now>=noticeUntil){if(notices.length){let a=notices.shift();box.textContent='🏅 MEDAGLIA SBLOCCATA • '+a[1]+' — '+a[2];box.style.display='block';noticeUntil=now+2600}else box.style.display='none'}}
document.querySelector('#medals').onclick=()=>{if(rankBox.dataset.mode==='medals'&&rankBox.style.display!=='none'){rankBox.style.display='none';return}rankBox.dataset.mode='medals';rankBox.replaceChildren();let h=document.createElement('p');h.textContent='MEDAGLIE '+earned.size+'/'+achievements.length;rankBox.append(h);for(let a of achievements){let d=document.createElement('div');d.style.cssText='padding:7px;border-bottom:1px solid #ffffff25;font-size:13px;opacity:'+(earned.has(a[0])?1:.55);d.style.color=tiers[tier(a[0])][1];d.textContent=(earned.has(a[0])?'🏅 ':'🔒 ')+a[1]+' • '+tiers[tier(a[0])][0]+' • '+a[2];rankBox.append(d)}rankBox.style.display='block';addCloseRank() };
let particles=[],muzzle=0,shake=0;
let blasts=[];
function burst(x,y,count,power){shake=Math.max(shake,4*power);blasts.push({x,y,life:.48,max:.48,power});if(blasts.length>50)blasts.shift();for(let i=0;i<count;i++){let angle=Math.random()*Math.PI*2,speed=rnd(15,110)*power,life=rnd(.3,1.3);particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life,max:life,r:rnd(1,5)*power,smoke:i%3===0,debris:i%3===1})}if(particles.length>420)particles.splice(0,particles.length-420)}
function updateEffects(dt){muzzle=Math.max(0,muzzle-dt);shake=Math.max(0,shake-dt*22);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}particles=particles.filter(p=>p.life>0);for(let b of blasts)b.life-=dt;blasts=blasts.filter(b=>b.life>0)}
function drawEffects(){g.save();for(let b of blasts){let x=px(b.x,b.y),y=py(b.y),phase=1-b.life/b.max,r=(7+phase*35)*b.power*depth(b.y);let halo=g.createRadialGradient(x,y,0,x,y,r);halo.addColorStop(0,'#fff8cb');halo.addColorStop(.25,'#ffc150');halo.addColorStop(.6,'#ec6a2377');halo.addColorStop(1,'#ee652300');g.globalAlpha=1-phase;g.fillStyle=halo;g.fillRect(x-r,y-r,2*r,2*r);g.strokeStyle='#ffca76';g.lineWidth=1.5;g.beginPath();g.arc(x,y,r*.85,0,7);g.stroke()}for(let p of particles){let f=p.life/p.max,x=px(p.x,p.y),y=py(p.y),z=depth(p.y),r=p.r*z;g.globalAlpha=Math.min(1,f*2);if(p.smoke){r*=1+(1-f)*2;let smoke=g.createRadialGradient(x,y,0,x,y,r);smoke.addColorStop(0,'#54565299');smoke.addColorStop(1,'#33363200');g.fillStyle=smoke;g.fillRect(x-r,y-r,2*r,2*r)}else if(p.debris){g.fillStyle='#a18c70';g.fillRect(x,y,r,r*.6)}else{g.strokeStyle='#ffd27b';g.lineWidth=Math.max(.7,r*.5);g.beginPath();g.moveTo(x,y);g.lineTo(x-p.vx*.045,y-p.vy*.045);g.stroke()}}g.globalAlpha=1;if(muzzle>0){let count=Math.min(n,24);for(let i=0;i<count;i++){let p=slot(i,count),x=px(p.x+10,p.y),y=py(p.y)-depth(p.y)*([13,25,23,28,25,29][weapon]);let z=depth(p.y),r=(4+Math.random()*5)*z;g.save();g.translate(x,y);g.shadowColor='#ff9e39';g.shadowBlur=10;g.fillStyle=weapon===5?'#a4faff':'#ffdd7b';g.beginPath();g.moveTo(0,-r*2);g.lineTo(r*.45,-r*.4);g.lineTo(r,0);g.lineTo(r*.3,r*.2);g.lineTo(0,r);g.lineTo(-r*.3,r*.2);g.lineTo(-r,0);g.lineTo(-r*.45,-r*.4);g.closePath();g.fill();g.restore()}}g.restore()}
function addCloseRank(){let close=document.createElement('button');close.textContent='CHIUDI';close.style.cssText='position:sticky;top:0;display:block;margin:0 auto 8px;z-index:2';close.onclick=()=>rankBox.style.display='none';rankBox.prepend(close)}

function medalArt(a){let color=tiers[tier(a[0])][1],got=earned.has(a[0]);return '<svg viewBox="0 0 60 66" aria-hidden="true"><path d="M12 2 H24 L30 19 L36 2 H48 L38 28 H22Z" fill="'+color+'" opacity=".8"/><circle cx="30" cy="43" r="20" fill="#17211c" stroke="'+color+'" stroke-width="3"/><circle cx="30" cy="43" r="16" fill="none" stroke="'+color+'" opacity=".5"/><path d="M30 30 L34 39 L44 39 L36 45 L39 55 L30 49 L21 55 L24 45 L16 39 L26 39Z" fill="'+color+'"/></svg>'}
renderArcade=function(){let a=document.querySelector('#arcadeRecords'),b=document.querySelector('#arcadeMedals');a.innerHTML='<h3>HIGH SCORES</h3><div class="scoreWindow"><div class="scoreTrack"></div></div><span class="hint">TOCCA PER APRIRE LA CLASSIFICA</span>';let track=a.querySelector('.scoreTrack');for(let pass=0;pass<2;pass++){records.forEach((r,i)=>{let d=document.createElement('div');d.className='scoreRow';d.style.color=i===0?'#e8ca82':'#eee';let l=document.createElement('span'),v=document.createElement('span');l.textContent=String(i+1).padStart(2,'0')+' '+r.name+(r.demo?' *':'');v.textContent=String(r.points).padStart(6,'0');d.append(l,v);track.append(d)})}b.innerHTML='<h3>MEDAGLIE '+earned.size+'/'+achievements.length+'</h3><div class="previewWindow"><div class="medalTrack"></div></div><span class="hint">TOCCA PER APRIRE IL MEDAGLIERE</span>';let mt=b.querySelector('.medalTrack');let sorted=achievements.slice().sort((a,b)=>Number(earned.has(b[0]))-Number(earned.has(a[0])));for(let pass=0;pass<2;pass++){let cycle=document.createElement('div');cycle.className='medalCycle';for(let a of sorted){let tile=document.createElement('div');tile.className='medalTile';tile.style.opacity=earned.has(a[0])?1:.4;tile.innerHTML=medalArt(a);let label=document.createElement('span');label.textContent=a[1];tile.append(label);cycle.append(tile)}mt.append(cycle)}a.onclick=()=>showRecords();b.onclick=()=>document.querySelector('#medals').onclick();for(let el of [a,b])el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}};
renderArcade();
let demoClock=0;const originalDraw=draw;draw=function(){originalDraw();if(!run){demoClock+=.016;g.save();g.setTransform(scale,0,0,scale,ox,oy);for(let i=0;i<16;i++){let yy=(demoClock*65+i*61)%590;soldier(45+(i*71)%270,yy,'#9b3934',i%7===0,false,i%8)}for(let i=0;i<8;i++){soldier(120+i%4*35,530+Math.floor(i/4)*15,'#315e86',false,true,i%7);g.fillStyle='#ffda79';let yy=(640-(demoClock*420+i*85)%640);g.fillRect(px(120+i%4*35,yy),py(yy),2,12)}for(let i=0;i<5;i++){let phase=(demoClock*.7+i*.23)%1;g.globalAlpha=(1-phase)*.75;g.fillStyle='#ffaf51';g.beginPath();g.arc(px(65+i*53,220+i*37),py(220+i*37),4+phase*22,0,Math.PI*2);g.fill()}g.restore()}};
